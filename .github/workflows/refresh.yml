name: Refresh id_token card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-card
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for PROFILE_TOKEN
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.PROFILE_TOKEN != '' }}
        run: |
          echo "ok=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then echo "PROFILE_TOKEN secret not set; skipping refresh."; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.ok == 'true'

      - name: Render card
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python3 scripts/render_token.py

      - name: Commit if changed
        if: steps.gate.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/id_token.svg
          git diff --cached --quiet || { git commit -m "Refresh id_token card"; git push; }
